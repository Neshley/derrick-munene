<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base App Tile -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="url(#amberGrad)" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Glowing Soundwave / Synth Accent -->
  <path d="M 64 240 Q 128 140 192 240 T 320 240 T 448 240" fill="none" stroke="url(#purpleGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" opacity="0.8"/>

  <!-- Synthesizer / Arranger Keyboard Display Matrix -->
  <rect x="76" y="80" width="360" height="120" rx="20" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  <rect x="92" y="96" width="130" height="40" rx="8" fill="#1e293b"/>
  <text x="100" y="122" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900" fill="#fbbf24">GENOS·PRO</text>
  
  <rect x="236" y="96" width="184" height="40" rx="8" fill="#1e293b"/>
  <text x="248" y="122" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#38bdf8">.STY ARRANGER</text>

  <!-- LED Level Meters in screen -->
  <circle cx="106" cy="162" r="7" fill="#10b981"/>
  <circle cx="130" cy="162" r="7" fill="#10b981"/>
  <circle cx="154" cy="162" r="7" fill="#fbbf24"/>
  <circle cx="178" cy="162" r="7" fill="#f43f5e"/>
  
  <rect x="236" y="152" width="184" height="20" rx="6" fill="#09090b" stroke="#1e293b" stroke-width="2"/>
  <rect x="238" y="154" width="120" height="16" rx="4" fill="url(#purpleGrad)"/>

  <!-- Piano / Arranger Keys Foundation -->
  <g transform="translate(66, 260)">
    <!-- White Keys -->
    <rect x="0" y="0" width="44" height="170" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="48" y="0" width="44" height="170" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="96" y="0" width="44" height="170" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="144" y="0" width="44" height="170" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="192" y="0" width="44" height="170" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="240" y="0" width="44" height="170" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="288" y="0" width="44" height="170" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="336" y="0" width="44" height="170" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>

    <!-- Black Keys -->
    <rect x="32" y="0" width="28" height="105" rx="5" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="80" y="0" width="28" height="105" rx="5" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    
    <rect x="176" y="0" width="28" height="105" rx="5" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="224" y="0" width="28" height="105" rx="5" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="272" y="0" width="28" height="105" rx="5" fill="#0f172a" stroke="#334155" stroke-width="2"/>

    <!-- Illuminated active key accent -->
    <rect x="144" y="0" width="44" height="170" rx="8" fill="url(#amberGrad)" opacity="0.9"/>
  </g>
</svg>
